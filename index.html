<head>

<title>R.C.N.D. – Régates 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#07111f;--navy:#0b1d30;--hull:#112840;--oar:#2e6ca4;
  --spray:#4a9fd4;--gold:#d4a843;--gold2:#f0c870;--coral:#e05c3a;--green:#2eb87a;
  --text:#ddeaf7;--muted:#6a8fad;--border:#1e3a55;--r:10px
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",sans-serif;background:var(--deep);color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 120% 60% at 20% 80%,rgba(30,74,117,.18) 0%,transparent 60%);pointer-events:none;z-index:0}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:rgba(11,29,48,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 14px;display:flex;align-items:center;height:60px;gap:8px}
.logo{font-family:"Playfair Display",serif;font-size:16px;font-weight:900;color:var(--gold);line-height:1;white-space:nowrap;margin-right:auto}
.logo small{display:block;font-size:8px;letter-spacing:2px;color:var(--muted);font-family:"Source Sans 3",sans-serif;font-weight:400;text-transform:uppercase}

/* ── MAIN TABS ── */
.main-tabs{display:flex;gap:2px;background:var(--hull);border-radius:8px;padding:3px}
.main-tab{padding:5px 14px;border-radius:6px;border:none;font-family:"Source Sans 3",sans-serif;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);background:transparent;transition:all .15s}
.main-tab.active{background:var(--oar);color:#fff}

/* ── WRAP ── */
.wrap{position:relative;z-index:1;padding:16px 13px 80px}
.page{display:none}.page.active{display:block}

/* ── LOADING BAR ── */
.lbar{height:3px;background:linear-gradient(90deg,var(--oar),var(--spray));border-radius:2px;animation:lb 1.4s infinite;margin-bottom:14px;display:none}
.lbar.on{display:block}
@keyframes lb{0%{width:0;margin-left:0}50%{width:55%;margin-left:22%}100%{width:0;margin-left:100%}}

/* ── BUTTONS ── */
.btn{padding:6px 12px;border-radius:7px;border:none;font-family:"Source Sans 3",sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.bgold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1000}
.boutline{background:transparent;border:1px solid var(--border);color:var(--text)}
.boar{background:rgba(46,108,164,.2);border:1px solid var(--oar);color:var(--spray)}
.bdanger{background:transparent;border:1px solid rgba(224,92,58,.4);color:var(--coral)}
select{background:var(--hull);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:"Source Sans 3",sans-serif;font-size:12px;padding:5px 9px;outline:none;-webkit-appearance:none}
select option{background:var(--hull)}

/* ── BADGES ── */
.cat-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700}
.cu13{background:rgba(240,200,112,.15);color:#f0c870}
.cu15{background:rgba(74,159,212,.15);color:#4a9fd4}
.cu17{background:rgba(46,184,122,.15);color:#2eb87a}
.cu19{background:rgba(212,168,67,.15);color:#d4a843}
.cu23{background:rgba(224,92,58,.15);color:#e05c3a}

/* ══════════════════════════════════
   PAGE 1 – PRÉSENCES
══════════════════════════════════ */
.ptitle{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;margin-bottom:4px}
.psubt{font-size:12px;color:var(--muted);margin-bottom:16px}

.rowers-grid{display:flex;flex-direction:column;gap:10px}
.rower-card{background:var(--navy);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.rower-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.rower-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-size:16px;font-weight:700;flex-shrink:0}
.rower-name{font-weight:600;font-size:14px;flex:1}
.rower-meta{display:flex;gap:5px;align-items:center}

.presences-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;padding:10px 14px}
.comp-pres{background:var(--hull);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.comp-pres-name{font-size:10px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.comp-pres-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.days-row{display:flex;gap:5px;flex-wrap:wrap}
.day-btn{flex:1;min-width:60px;padding:5px 4px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent;font-family:"Source Sans 3",sans-serif}
.day-btn.present{color:#fff;border-color:var(--active-color,var(--green));background:color-mix(in srgb,var(--active-color,var(--green)) 25%,transparent)}
.day-btn:hover:not(.present){border-color:var(--muted)}

.pres-count{font-size:10px;color:var(--muted);margin-top:5px;text-align:center}

/* ══════════════════════════════════
   PAGE 2 – INSCRIPTIONS TABLE
══════════════════════════════════ */
.sbar{background:var(--hull);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sv{font-family:"Playfair Display",serif;font-size:20px;color:var(--gold);line-height:1}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

.ctabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ctab{padding:5px 11px;border-radius:20px;border:2px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ctab.active{color:#fff;border-color:var(--active-color,var(--oar));background:color-mix(in srgb,var(--active-color,var(--oar)) 20%,transparent)}

.sticky-head-wrap{position:sticky;top:60px;z-index:50;overflow-x:hidden;background:var(--hull);border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:var(--r) var(--r) 0 0}
.table-outer{border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);background:var(--navy)}
.table-body-wrap{overflow-x:auto}
.sticky-head-wrap table,.table-body-wrap table{border-collapse:collapse;table-layout:fixed}

.course-num{display:inline-block;padding:2px 5px;border-radius:4px;font-size:10px;font-weight:800}
.cb{width:36px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:5px;cursor:pointer;border:1px solid transparent;-webkit-tap-highlight-color:transparent;user-select:none;margin:0 auto;transition:background .1s}
.cb.av{background:rgba(46,108,164,.1);border-color:rgba(46,108,164,.2)}
.cb.av:hover{background:rgba(46,108,164,.28);border-color:var(--oar)}
.cb.en{background:rgba(46,184,122,.2);border-color:rgba(46,184,122,.45)}
.cb.up{background:rgba(212,168,67,.08);border-color:rgba(212,168,67,.28)}
.cb.up.en{background:rgba(212,168,67,.22);border-color:var(--gold)}
.cb.no{opacity:.1;cursor:default;pointer-events:none}

/* ── MODAL ── */
.mbg{display:none;position:fixed;inset:0;background:rgba(4,10,18,.88);z-index:500;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 12px}
.mbg.open{display:flex}
.modal{background:var(--navy);border:1px solid var(--border);border-radius:var(--r);padding:20px;max-width:600px;width:100%;margin:auto}
.mtitle{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;color:var(--gold);margin-bottom:14px}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--hull);border-radius:7px;margin-bottom:4px;font-size:12px;gap:8px}
.csect{margin-bottom:14px}
.csect-head{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* ── FLASH ── */
#_fl{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#112840;border:1px solid #1e3a55;border-radius:8px;padding:9px 18px;font-size:13px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;opacity:0}

.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:10px;align-items:center}
.ld{width:13px;height:13px;border-radius:3px;flex-shrink:0;border:1px solid transparent}
</style>
</head>

  <div class="ctabs" id="ctabs"></div>
  <div class="sticky-head-wrap" id="tableHead"></div>
  <div class="table-outer"><div class="table-body-wrap" id="tableBody">
    <div style="padding:24px;text-align:center;color:var(--muted)">Chargement...</div>
  </div></div>
</div>
</div>

<!-- Summary modal -->
<div class="mbg" id="mbg" onclick="if(event.target===this)closeSummary()">

</div>

/* ══ ELIGIBILITY ══ */
function elig(rower,course){
  if(course.rowerIds!==undefined) return course.rowerIds.indexOf(rower.id)!==-1?"normal":false;
  var g=G[rower.id]||"M",cat=rower.cat;
  var norm=(g==="M")?(course.catM||[]):(course.catW||[]);
  if(norm.indexOf(cat)!==-1) return "normal";
  if(cat==="U17"){
    var up=(g==="M")?(course.upM||[]):(course.upW||[]);
    if(up.indexOf("U17")!==-1) return "up";
  }
  return false;
}

/* ══ Check if rower is present for a given course's day ══ */
function isPresent(rowerId,compId,courseDay){
  if(!pres[rowerId]||!pres[rowerId][compId]) return false;
  var days=pres[rowerId][compId];
  // courseDay undefined = single-day regata, check "Présent"
  var dayKey=courseDay||"Présent";
  return days.has(dayKey);
}

});

function loadAll(){
  // Load registrations
  db.collection("regata_inscriptions").onSnapshot(function(snap){
    regs={};
    snap.docs.forEach(function(d){
      var v=d.data();
      if(!regs[v.rowerId])regs[v.rowerId]={};
      if(!regs[v.rowerId][v.compId])regs[v.rowerId][v.compId]=new Set();
      regs[v.rowerId][v.compId].add(v.courseCode);
    });
    if(loaded) renderAll();
  });
  // Load presences
  db.collection("regata_presences").onSnapshot(function(snap){
    pres={};
    snap.docs.forEach(function(d){
      var v=d.data();
      if(!pres[v.rowerId])pres[v.rowerId]={};
      if(!pres[v.rowerId][v.compId])pres[v.rowerId][v.compId]=new Set();
      pres[v.rowerId][v.compId].add(v.day);
    });
    loaded=true;
    ld(false);
    renderAll();
  });
}

/* ══ TOGGLE PRESENCE ══
   When toggling a day:
   - if becoming present: auto-register all eligible courses for that day
   - if becoming absent: remove registrations for courses of that day
══ */
function togglePresence(rowerId,compId,day){
  if(!pres[rowerId])pres[rowerId]={};
  if(!pres[rowerId][compId])pres[rowerId][compId]=new Set();
  var daySet=pres[rowerId][compId];
  var docId=rowerId+"_"+compId+"_"+day.replace(/ /g,"_");
  var comp=COMPS.find(function(x){return x.id===compId;});
  var rower=rowers.find(function(x){return x.id===rowerId;});
  if(!comp||!rower)return;

  if(daySet.has(day)){
    // Remove presence
    daySet.delete(day);
    db.collection("regata_presences").doc(docId).delete();
    // Remove registrations for courses of this day
    comp.courses.forEach(function(cr){
      var courseDay=cr.day||"Présent";
      if(courseDay!==day) return;
      if(regs[rowerId]&&regs[rowerId][compId]&&regs[rowerId][compId].has(cr.c)){
        regs[rowerId][compId].delete(cr.c);
        db.collection("regata_inscriptions").doc(rowerId+"_"+compId+"_"+cr.c).delete();
      }
    });
    flash("Absent – inscriptions retirées","ok");
  } else {
    // Add presence
    daySet.add(day);
    db.collection("regata_presences").doc(docId).set({rowerId:rowerId,compId:compId,day:day,ts:firebase.firestore.FieldValue.serverTimestamp()});
    // Auto-register all eligible courses for this day
    var count=0;
    comp.courses.forEach(function(cr){
      var courseDay=cr.day||"Présent";
      if(courseDay!==day) return;
      if(!elig(rower,cr)) return;
      if(!regs[rowerId])regs[rowerId]={};
      if(!regs[rowerId][compId])regs[rowerId][compId]=new Set();
      if(!regs[rowerId][compId].has(cr.c)){
        regs[rowerId][compId].add(cr.c);
        db.collection("regata_inscriptions").doc(rowerId+"_"+compId+"_"+cr.c).set({
          rowerId:rowerId,compId:compId,courseCode:cr.c,
          ts:firebase.firestore.FieldValue.serverTimestamp()
        });
        count++;
      }
    });
    flash("Présent – "+count+" course"+(count>1?"s":"")+" inscrite"+(count>1?"s":""),"ok");
  }
  renderAll();
}

/* ══ TOGGLE individual course ══ */
function toggleCell(el){
  var rid=el.dataset.rid,cid=el.dataset.cid,code=el.dataset.code;
  if(!regs[rid])regs[rid]={};
  if(!regs[rid][cid])regs[rid][cid]=new Set();
  var s=regs[rid][cid],doc=rid+"_"+cid+"_"+code;
  if(s.has(code)){
    s.delete(code);
    db.collection("regata_inscriptions").doc(doc).delete();
    flash("Désinscrit","ok");
  }else{
    s.add(code);
    db.collection("regata_inscriptions").doc(doc).set({rowerId:rid,compId:cid,courseCode:code,ts:firebase.firestore.FieldValue.serverTimestamp()});
    flash("Inscrit &#10003;","ok");
  }
  renderAll();
}

function renderPresences(){

    return;
  }
  var h="";
  rowers.forEach(function(rower){
    var g=G[rower.id]||"M";
    var cc="cu"+(rower.cat||"").toLowerCase().replace("u","");
    var col=avcol(rower.id);
    var initials=(rower.name||"?").split(" ").map(function(w){return w[0];}).join("").substring(0,2).toUpperCase();
    h+='<div class="rower-card">';
    h+='<div class="rower-head">';
    h+='<div class="rower-avatar" style="background:color-mix(in srgb,'+col+' 25%,var(--hull));color:'+col+';border:1.5px solid color-mix(in srgb,'+col+' 40%,transparent)">'+initials+'</div>';
    h+='<div class="rower-name">'+xe(rower.name)+'</div>';
    h+='<div class="rower-meta"><span class="cat-badge '+cc+'">'+(rower.cat||"?")+'</span>';
    h+='<span style="font-size:11px;color:'+(g==="M"?"#7eceff":"#ffb3d1")+'">'+(g==="M"?"&#9794;":"&#9792;")+'</span></div>';
    h+='</div>';
    h+='<div class="presences-grid">';
    COMPS.forEach(function(comp){
      var presSet=(pres[rower.id]&&pres[rower.id][comp.id])?pres[rower.id][comp.id]:new Set();
      // Count inscriptions for this comp
      var inscCount=(regs[rower.id]&&regs[rower.id][comp.id])?regs[rower.id][comp.id].size:0;
      h+='<div class="comp-pres">';
      h+='<div class="comp-pres-name"><div class="comp-pres-dot" style="background:'+comp.color+'"></div>';
      h+='<span style="color:'+comp.color+'">'+comp.date.substring(5).split("-").reverse().join("/")+'</span>&nbsp;';
      h+='<span style="color:var(--text);font-size:10px">'+comp.name+'</span></div>';
      h+='<div class="days-row">';
      comp.days.forEach(function(day){
        var present=presSet.has(day);
        h+='<button class="day-btn'+(present?" present":"")+'" style="--active-color:'+comp.color+'"';
        h+=' data-rid="'+rower.id+'" data-cid="'+comp.id+'" data-day="'+day+'" onclick="togglePresence(this.dataset.rid,this.dataset.cid,this.dataset.day)">';
        h+=day;
        h+='</button>';
      });
      h+='</div>';
      if(inscCount>0) h+='<div class="pres-count">'+inscCount+' course'+(inscCount>1?"s":"")+'</div>';
      h+='</div>';
    });
    h+='</div></div>';
  });
  document.getElementById("rowersGrid").innerHTML=h;
}

/* ══ PAGE 2: TABS ══ */
function buildTabs(){
  var h="";
  COMPS.forEach(function(comp){
    var active=comp.id===activeCid;
    h+='<button class="ctab'+(active?" active":"")+'" style="--active-color:'+comp.color+'" onclick="setComp(\''+comp.id+'\')">';
    h+=fd(comp.date)+' '+comp.name+'</button>';
  });
  document.getElementById("ctabs").innerHTML=h;
}
function setComp(id){activeCid=id;buildTabs();renderTable();}

/* ══ PAGE 2: TABLE ══ */
function renderTable(){
  var fc=document.getElementById("filterCat").value;
  var comp=COMPS.find(function(x){return x.id===activeCid;});
  if(!comp)return;
  var cols=fc?rowers.filter(function(r){return r.cat===fc;}):rowers;
  var headEl=document.getElementById("tableHead");
  var bodyEl=document.getElementById("tableBody");
  if(!cols.length){
    headEl.innerHTML="";
    bodyEl.innerHTML='<div style="padding:24px;text-align:center;color:var(--muted)">Aucun rameur.</div>';
    return;
  }
  var color=comp.color;
  var C0=52,C1=62,C2=175,CR=44;
  var TW=C0+C1+C2+cols.length*CR;

  function cg(){
    var s='<colgroup><col style="width:'+C0+'px"><col style="width:'+C1+'px"><col style="width:'+C2+'px">';
    cols.forEach(function(){s+='<col style="width:'+CR+'px">';});
    return s+'</colgroup>';
  }

  // Header
  var hh='<table style="table-layout:fixed;width:'+TW+'px">'+cg()+'<tr>';
  hh+='<th style="text-align:center;padding:5px 3px;font-size:9px;color:'+color+'">N&#176;</th>';
  hh+='<th style="text-align:center;padding:5px 3px;font-size:9px;color:'+color+'">Heure</th>';
  hh+='<th style="text-align:left;padding:5px 8px;font-size:9px;color:'+color+';border-right:2px solid var(--border)">&#201;preuve</th>';
  cols.forEach(function(rower){
    var g=G[rower.id]||"M";
    var cc="cu"+(rower.cat||"").toLowerCase().replace("u","");
    hh+='<th style="padding:5px 3px;vertical-align:bottom;text-align:center">';
    hh+='<div style="display:flex;flex-direction:column;align-items:center;gap:2px">';
    hh+='<div style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:600;white-space:nowrap;max-height:110px;overflow:hidden;line-height:1.2">'+xe(rower.name)+'</div>';
    hh+='<span class="cat-badge '+cc+'">'+(rower.cat||"?")+'</span>';
    hh+='<span style="font-size:9px;color:'+(g==="M"?"#7eceff":"#ffb3d1")+'">'+(g==="M"?"&#9794;":"&#9792;")+'</span>';
    hh+='</div></th>';
  });
  hh+='</tr></table>';
  headEl.innerHTML=hh;

  // Body
  var bh='<table style="table-layout:fixed;width:'+TW+'px">'+cg()+'<tbody>';
  comp.courses.forEach(function(cr,ri){
    var stripe=ri%2===0?"":"background:rgba(17,40,64,.3)";
    bh+='<tr style="'+stripe+';border-bottom:1px solid rgba(30,58,85,.3)">';
    bh+='<td style="text-align:center;padding:4px 2px"><span class="course-num" style="background:color-mix(in srgb,'+color+' 20%,transparent);color:'+color+'">'+cr.c+'</span></td>';
    bh+='<td style="text-align:center;padding:4px 2px;color:'+color+';font-size:11px;font-weight:700;white-space:nowrap">'+cr.t+'</td>';
    bh+='<td style="text-align:left;padding:4px 8px;border-right:2px solid var(--border);font-size:11px">'+cr.l+' <span style="color:var(--muted);font-size:9px">'+cr.d+'</span></td>';
    cols.forEach(function(rower){
      var e=elig(rower,cr);
      var enrolled=e&&regs[rower.id]&&regs[rower.id][comp.id]&&regs[rower.id][comp.id].has(cr.c);
      bh+='<td style="padding:3px">';
      if(!e){
        bh+='<div class="cb no">&#8212;</div>';
      }else{
        var cls="cb "+(e==="up"?"up":"av")+(enrolled?" en":"");
        bh+='<div class="'+cls+'" data-rid="'+rower.id+'" data-cid="'+comp.id+'" data-code="'+cr.c+'" onclick="toggleCell(this)">';
        bh+=enrolled?'<span style="font-size:15px;color:'+(e==="up"?"var(--gold)":"var(--green)")+'">&#10003;</span>':'<span style="font-size:12px;color:var(--muted)">&#9675;</span>';
        bh+='</div>';
      }
      bh+='</td>';
    });
    bh+='</tr>';
  });
  bh+='</tbody></table>';
  bodyEl.innerHTML=bh;
  bodyEl.onscroll=function(){headEl.scrollLeft=bodyEl.scrollLeft;};
}

/* ══ SUMMARY BAR ══ */
function renderBar(){
  var tot=0,rs=new Set(),cs=new Set();
  Object.keys(regs).forEach(function(rid){
    Object.keys(regs[rid]).forEach(function(cid){
      var sz=regs[rid][cid].size;
      if(sz>0){rs.add(rid);cs.add(cid);tot+=sz;}
    });
  });
  document.getElementById("sumTotal").textContent=tot;
  document.getElementById("sumRowers").textContent=rs.size;
  document.getElementById("sumRegatas").textContent=cs.size;
}

/* ══ SUMMARY MODAL ══ */
function openSummary(){
  var h="";
  COMPS.forEach(function(comp){
    var rows=[];
    rowers.forEach(function(rower){
      if(regs[rower.id]&&regs[rower.id][comp.id]&&regs[rower.id][comp.id].size>0){
        rows.push({r:rower,codes:Array.from(regs[rower.id][comp.id]).sort()});
      }
    });
    if(!rows.length)return;
    h+='<div class="csect"><div class="csect-head" style="color:'+comp.color+'">'+fd(comp.date)+' &#8211; '+comp.name+'</div>';
    rows.forEach(function(row){
      var g=G[row.r.id]||"M";
      var cc="cu"+(row.r.cat||"").toLowerCase().replace("u","");
      var details=row.codes.map(function(code){
        var cr=comp.courses.find(function(x){return x.c===code;});
        return cr?('<b>'+code+'</b> <span style="color:var(--muted)">'+cr.t+'</span>'):code;
      }).join(" &#183; ");
      h+='<div class="mrow"><span><b>'+xe(row.r.name)+'</b> <span class="cat-badge '+cc+'">'+(row.r.cat||"")+'</span> <span style="color:'+(g==="M"?"#7eceff":"#ffb3d1")+'">'+(g==="M"?"&#9794;":"&#9792;")+'</span></span>';
      h+='<span style="color:var(--spray);font-size:11px;text-align:right">'+details+'</span></div>';
    });
    h+='</div>';
  });
  if(!h)h='<div style="text-align:center;color:var(--muted);padding:20px">Aucune inscription.</div>';
  document.getElementById("mbody").innerHTML=h;
  document.getElementById("mbg").classList.add("open");
}
function closeSummary(){document.getElementById("mbg").classList.remove("open");}

/* ══ CSV ══ */
function exportCSV(){
  var lines=["Rameur;Genre;Cat;R&#233;gate;Date;Code;Heure;&#201;preuve;Distance;Mont&#233;e"];
  rowers.forEach(function(rower){
    if(!regs[rower.id])return;
    var g=G[rower.id]||"M";
    COMPS.forEach(function(comp){
      if(!regs[rower.id][comp.id])return;
      Array.from(regs[rower.id][comp.id]).sort().forEach(function(code){
        var cr=comp.courses.find(function(x){return x.c===code;});
        if(!cr)return;
        var e=elig(rower,cr);
        lines.push([rower.name,g,rower.cat,comp.name,comp.date,code,cr.t,cr.l,cr.d,e==="up"?"U17>U19":""].join(";"));
      });
    });
  });
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download="inscriptions_2026.csv";a.click();
  flash("CSV export&#233; &#10003;","ok");
}

/* ══ CLEAR ALL ══ */
function clearAll(){
  if(!confirm("Effacer TOUTES les inscriptions et pr&#233;sences r&#233;gates ?"))return;
  ld(true);
  var p1=db.collection("regata_inscriptions").get().then(function(snap){
    var b=db.batch();snap.docs.forEach(function(d){b.delete(d.ref);});return b.commit();
  });
  var p2=db.collection("regata_presences").get().then(function(snap){
    var b=db.batch();snap.docs.forEach(function(d){b.delete(d.ref);});return b.commit();
  });
  Promise.all([p1,p2]).then(function(){regs={};pres={};ld(false);renderAll();flash("Effac&#233;","ok");})
    .catch(function(e){flash("Erreur: "+e.message);ld(false);});
}

/* ══ PAGE SWITCH ══ */
function setPage(id){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".main-tab").forEach(function(t){t.classList.remove("active");});
  document.getElementById("page-"+id).classList.add("active");
  var tabs=document.querySelectorAll(".main-tab");
  if(id==="presences")tabs[0].classList.add("active");
  else tabs[1].classList.add("active");
}

/* ══ HELPERS ══ */
function xe(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fd(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
var _ft;
function flash(m,t){var e=document.getElementById("_fl");e.innerHTML=m;e.style.color=(t==="ok")?"#2eb87a":"#e05c3a";e.style.opacity="1";clearTimeout(_ft);_ft=setTimeout(function(){e.style.opacity="0";},2500);}
</script>
